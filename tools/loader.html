<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Zu Fuss durch Japan</title>
<script>try { const t = localStorage.getItem("jw-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}</script>
<style>
:root { --bg: #F1E8D8; --sheet: #FDF5E8; --ink: #2B2622; --ink2: #6B635A; --shu: #B4432E; --line: #DDD6C8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1C1A18; --sheet: #26231F; --ink: #EDE7DC; --ink2: #A79E91; --shu: #D0664F; --line: #3A352F; } }
:root[data-theme="dark"] { --bg: #1C1A18; --sheet: #26231F; --ink: #EDE7DC; --ink2: #A79E91; --shu: #D0664F; --line: #3A352F; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
main { min-height: 100vh; display: grid; place-items: center; padding: 64px 16px 24px; }
.card { width: 100%; max-width: 400px; background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 28px 24px 22px; text-align: center; }
.neko { display: block; width: calc(100% + 24px); height: auto; aspect-ratio: 1200 / 1000; margin: -14px -12px 6px; object-fit: cover;
  -webkit-mask-image: radial-gradient(ellipse 72% 70% at 50% 50%, #000 58%, transparent 100%); mask-image: radial-gradient(ellipse 72% 70% at 50% 50%, #000 58%, transparent 100%); }
.neko.night { display: none; -webkit-mask-image: radial-gradient(ellipse 72% 70% at 50% 50%, #000 62%, transparent 100%); mask-image: radial-gradient(ellipse 72% 70% at 50% 50%, #000 62%, transparent 100%); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .neko.day { display: none; } :root:not([data-theme="light"]) .neko.night { display: block; } }
:root[data-theme="dark"] .neko.day { display: none; } :root[data-theme="dark"] .neko.night { display: block; }
.themetog { position: fixed; top: max(12px, env(safe-area-inset-top)); right: 12px; width: 38px; height: 38px; padding: 0; border-radius: 999px; border: 0; background: none; color: var(--ink); font-size: 17px; line-height: 1; display: grid; color: var(--ink2); place-items: center; cursor: pointer; z-index: 2; }
.themetog:focus-visible { outline: 2px solid var(--shu); outline-offset: 2px; }
h1 { font: 600 22px/1.25 Georgia, "Times New Roman", serif; margin: 0 0 6px; }
p { margin: 0 0 18px; color: var(--ink2); font-size: 14.5px; }
input { width: 100%; font: inherit; padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
input:focus { outline: 2px solid var(--shu); outline-offset: 1px; }
label.rem { display: flex; gap: 8px; align-items: center; justify-content: center; font-size: 13.5px; color: var(--ink2); margin: 12px 0 16px; }
button { width: 100%; font: 600 15px/1 inherit; font-family: inherit; padding: 12px; border: 0; border-radius: 999px; background: var(--shu); color: #fff; cursor: pointer; }
button[disabled] { opacity: .6; }
.err { color: var(--shu); font-size: 13.5px; min-height: 20px; margin: 10px 0 0; }
.lang { margin-top: 14px; font-size: 12.5px; color: var(--ink2); }
.lang a { color: inherit; }
</style>
</head>
<body>
<button type="button" class="themetog" id="themetog" aria-label="Zum dunklen Modus wechseln" title="朝 / 夜 · Hell / Dunkel"></button>
<main>
  <form class="card" id="f" autocomplete="on">
    <picture>
      <source type="image/webp" srcset="login-640.webp 640w, login-1200.webp 1200w" sizes="(max-width: 440px) 92vw, 400px">
      <img class="neko day" id="neko" src="login-1200.jpg" width="1200" height="1000" alt="Maneki-neko als Wanderer auf der Strasse, mit Strohhut, Wanderstab und Banner «千里の道», dahinter der Fuji">
    </picture>
    <picture>
      <source type="image/webp" srcset="login-night-640.webp 640w, login-night-1200.webp 1200w" sizes="(max-width: 440px) 92vw, 400px">
      <img class="neko night" id="nekoN" src="login-night-1200.jpg" width="1200" height="1000" loading="lazy" alt="Dieselbe Szene bei Nacht, unter dem Vollmond">
    </picture>
    <h1 id="h">Zu Fuss durch Japan</h1>
    <p id="lead">Diese Seite ist privat. Gib das Passwort ein, das du bekommen hast.</p>
    <input id="pw" type="password" autocomplete="current-password" aria-label="Passwort" placeholder="Passwort" required>
    <label class="rem"><input id="rem" type="checkbox" checked style="width:auto"> <span id="remt">Auf diesem Gerät merken</span></label>
    <button id="go" type="submit">Öffnen</button>
    <div class="err" id="err" role="alert"></div>
    <div class="lang"><a href="#" id="en">English</a></div>
  </form>
</main>
<script>
(function () {
  const SALT = "__SALT__", ITER = __ITER__, BLOB = "__BLOB__";
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const T = { de: ["Zu Fuss durch Japan", "Diese Seite ist privat. Gib das Passwort ein, das du bekommen hast.", "Passwort", "Auf diesem Gerät merken", "Öffnen", "Das Passwort stimmt nicht.", "English", "Wird geöffnet…"],
              en: ["Walking across Japan", "This page is private. Enter the password you were given.", "Password", "Remember on this device", "Open", "That password isn't right.", "Deutsch", "Opening…"] };
  let lang = "de";
  const $ = (id) => document.getElementById(id);
  function setLang(l) { lang = l; const t = T[l]; $("h").textContent = t[0]; $("lead").textContent = t[1]; $("pw").placeholder = t[2]; $("pw").setAttribute("aria-label", t[2]); $("remt").textContent = t[3]; $("go").textContent = t[4]; $("en").textContent = t[6]; $("neko").alt = l === "de" ? "Maneki-neko als Wanderer auf der Strasse, mit Strohhut, Wanderstab und Banner «千里の道», dahinter der Fuji" : "Maneki-neko as a traveller on the road, with straw hat, walking stick and a 千里の道 banner, Mount Fuji behind"; document.documentElement.lang = l; $("nekoN").alt = l === "de" ? "Dieselbe Szene bei Nacht, unter dem Vollmond" : "The same scene at night, under the full moon"; themeBtn(); }
const TH_ICON = {
    // 朝: morning (shown in dark mode: tap for light)
    asa: '<svg viewBox="0 0 32 32" width="31" height="31" aria-hidden="true"><circle cx="16" cy="16" r="14.6" fill="none" stroke="currentColor" stroke-width="1.6"/><g stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M10.5 4.6v2.2M10.5 14.2v2.2M4.7 10.5h2.2M14.1 10.5h2.2M6.4 6.4l1.5 1.5M13.1 13.1l1.5 1.5M6.4 14.6l1.5-1.5M13.1 7.9l1.5-1.5"/></g><circle cx="10.5" cy="10.5" r="2.6" fill="currentColor"/><text x="20.2" y="25.6" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor" font-family="Hiragino Sans, Yu Gothic, Noto Sans JP, sans-serif">朝</text></svg>',
    // 夜: night (shown in light mode: tap for dark)
    yoru: '<svg viewBox="0 0 32 32" width="31" height="31" aria-hidden="true"><circle cx="16" cy="16" r="14.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12.6 5.4a5.6 5.6 0 1 0 2.6 9.6a4.6 4.6 0 0 1-2.6-9.6z" fill="currentColor"/><path d="M6.4 6.2l.55 1.15 1.25.18-.9.88.21 1.24-1.11-.59-1.11.59.21-1.24-.9-.88 1.25-.18z" fill="currentColor"/><text x="20.2" y="25.6" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor" font-family="Hiragino Sans, Yu Gothic, Noto Sans JP, sans-serif">夜</text></svg>',
  };
  const isDark = () => { const t = document.documentElement.dataset.theme; return t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches); };
  function themeBtn() { const d = isDark(); $("themetog").innerHTML = d ? TH_ICON.asa : TH_ICON.yoru; $("themetog").setAttribute("aria-label", d ? (lang === "de" ? "Zum hellen Modus wechseln" : "Switch to light mode") : (lang === "de" ? "Zum dunklen Modus wechseln" : "Switch to dark mode")); }
  $("themetog").addEventListener("click", () => { const n = isDark() ? "light" : "dark"; document.documentElement.dataset.theme = n; try { localStorage.setItem("jw-theme", n); } catch {} themeBtn(); });
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", themeBtn);
  themeBtn();
  $("en").addEventListener("click", (e) => { e.preventDefault(); setLang(lang === "de" ? "en" : "de"); });
  async function keyFrom(pw) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(SALT), iterations: ITER, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  }
  async function open(key) {
    const all = b64(BLOB);
    const gz = await crypto.subtle.decrypt({ name: "AES-GCM", iv: all.slice(0, 12) }, key, all.slice(12));
    const html = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    window.__KEY = key;
    document.open(); document.write(html); document.close();
  }
  async function tryKey(key, remember) {
    await open(key);
    if (remember) { try { localStorage.setItem("jw-key", JSON.stringify(await crypto.subtle.exportKey("jwk", key))); } catch {} }
  }
  // a link like …/#k=PASSWORD opens directly; the password is then removed from the address bar
  const hk = new URLSearchParams(location.hash.slice(1)).get("k");
  if (hk) history.replaceState(null, "", location.pathname + location.search);
  (async () => {
    try { const j = localStorage.getItem("jw-key"); if (j) { const k = await crypto.subtle.importKey("jwk", JSON.parse(j), { name: "AES-GCM" }, true, ["decrypt"]); return await tryKey(k, false); } } catch { try { localStorage.removeItem("jw-key"); } catch {} }
    if (hk) { try { return await tryKey(await keyFrom(hk), true); } catch {} }
    $("pw").focus();
  })();
  $("f").addEventListener("submit", async (e) => {
    e.preventDefault(); $("err").textContent = ""; $("go").disabled = true; $("go").textContent = T[lang][7];
    try { await tryKey(await keyFrom($("pw").value), $("rem").checked); }
    catch { $("err").textContent = T[lang][5]; $("go").disabled = false; $("go").textContent = T[lang][4]; $("pw").select(); }
  });
})();
</script>
</body>
</html>
